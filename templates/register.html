<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — ParkFlow</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center">
  <div class="bg-white p-8 rounded-xl border border-slate-200 w-full max-w-md">
    <h1 class="text-2xl font-bold mb-1">Create attendant account</h1>
    <p class="text-slate-500 text-sm mb-6">
      Already have an account? <a href="/login" class="text-indigo-600 hover:underline">Log in</a>
    </p>

    <form id="register-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1" for="name">Name</label>
        <input id="name" name="name" type="text" required
               class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1" for="email">Email</label>
        <input id="email" name="email" type="email" required
               class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1" for="password">Password</label>
        <input id="password" name="password" type="password" required minlength="8"
               class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        <p class="text-xs text-slate-400 mt-1">
          At least 8 characters, with an uppercase letter, a lowercase letter, a digit,
          and a special character.
        </p>
      </div>

      <p id="error-message" class="text-red-600 text-sm hidden"></p>

      <button type="submit"
              class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700">
        Register
      </button>
    </form>
  </div>

  <script src="/static/js/auth.js"></script>
</body>
</html>
