<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — ParkFlow</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <header class="bg-white border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <span class="text-xl font-bold text-indigo-600">ParkFlow</span>
      <div class="flex items-center gap-4">
        <span id="user-name" class="text-slate-600 text-sm"></span>
        <button id="logout-btn" class="text-sm bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg">
          Logout
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-8 space-y-8">

    <!-- Stats -->
    <section class="grid grid-cols-2 md:grid-cols-5 gap-4">
      <div class="bg-white p-4 rounded-xl border border-slate-200">
        <p class="text-xs text-slate-500">Total Spots</p>
        <p id="stat-total" class="text-2xl font-bold">—</p>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200">
        <p class="text-xs text-slate-500">Available</p>
        <p id="stat-available" class="text-2xl font-bold text-green-600">—</p>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200">
        <p class="text-xs text-slate-500">Occupied</p>
        <p id="stat-occupied" class="text-2xl font-bold text-slate-700">—</p>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200">
        <p class="text-xs text-slate-500">Total EV Spots</p>
        <p id="stat-ev-total" class="text-2xl font-bold">—</p>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200">
        <p class="text-xs text-slate-500">EV Available</p>
        <p id="stat-ev-available" class="text-2xl font-bold text-green-600">—</p>
      </div>
    </section>

    <!-- Check-in + Search -->
    <section class="grid md:grid-cols-2 gap-6">
      <div class="bg-white p-6 rounded-xl border border-slate-200">
        <h2 class="font-semibold text-lg mb-4">Check In Vehicle</h2>
        <form id="checkin-form" class="space-y-3">
          <div>
            <label class="block text-sm font-medium mb-1">License Plate</label>
            <input id="checkin-plate" type="text" required placeholder="e.g. KA01AB1234"
                   class="w-full border border-slate-300 rounded-lg px-3 py-2 uppercase focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            <p class="text-xs text-slate-400 mt-1">Indian format: state code, RTO code, series, number.</p>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Vehicle Type</label>
            <select id="checkin-type" class="w-full border border-slate-300 rounded-lg px-3 py-2">
              <option value="compact">Compact</option>
              <option value="standard">Standard</option>
              <option value="ev">EV</option>
            </select>
          </div>
          <p id="checkin-message" class="text-sm hidden"></p>
          <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700">
            Check In
          </button>
        </form>
      </div>

      <div class="bg-white p-6 rounded-xl border border-slate-200">
        <h2 class="font-semibold text-lg mb-4">Find Vehicle / Check Out</h2>
        <form id="search-form" class="flex gap-2 mb-4">
          <input id="search-plate" type="text" placeholder="Enter license plate" required
                 class="flex-1 border border-slate-300 rounded-lg px-3 py-2 uppercase focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          <button type="submit" class="bg-slate-800 text-white px-4 py-2 rounded-lg hover:bg-slate-900">
            Search
          </button>
        </form>

        <div id="vehicle-result" class="text-sm text-slate-500">
          No vehicle looked up yet.
        </div>
      </div>
    </section>

    <!-- History -->
    <section class="bg-white p-6 rounded-xl border border-slate-200">
      <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
        <h2 class="font-semibold text-lg">Parking History</h2>
        <div class="flex flex-wrap gap-2">
          <input id="history-search" type="text" placeholder="Search plate..."
                 class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm" />
          <select id="history-sort" class="border border-slate-300 rounded-lg px-2 py-1.5 text-sm">
            <option value="check_in">Check-in time</option>
            <option value="check_out">Check-out time</option>
            <option value="fee">Fee</option>
            <option value="plate_number">Plate</option>
            <option value="status">Status</option>
          </select>
          <select id="history-order" class="border border-slate-300 rounded-lg px-2 py-1.5 text-sm">
            <option value="desc">Descending</option>
            <option value="asc">Ascending</option>
          </select>
          <select id="history-limit" class="border border-slate-300 rounded-lg px-2 py-1.5 text-sm">
            <option value="10">10 / page</option>
            <option value="25">25 / page</option>
            <option value="50">50 / page</option>
          </select>
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="text-left text-slate-500 border-b border-slate-200">
              <th class="py-2 pr-4">Plate</th>
              <th class="py-2 pr-4">Type</th>
              <th class="py-2 pr-4">Spot</th>
              <th class="py-2 pr-4">Check-in</th>
              <th class="py-2 pr-4">Check-out</th>
              <th class="py-2 pr-4">Fee</th>
              <th class="py-2 pr-4">Status</th>
            </tr>
          </thead>
          <tbody id="history-body"></tbody>
        </table>
      </div>

      <div class="flex items-center justify-between mt-4 text-sm">
        <span id="history-summary" class="text-slate-500"></span>
        <div class="flex gap-2">
          <button id="history-prev" class="px-3 py-1.5 border border-slate-300 rounded-lg hover:bg-slate-50">Prev</button>
          <span id="history-page" class="px-2 py-1.5"></span>
          <button id="history-next" class="px-3 py-1.5 border border-slate-300 rounded-lg hover:bg-slate-50">Next</button>
        </div>
      </div>
    </section>

  </main>

  <script src="/static/js/dashboard.js"></script>
</body>
</html>
